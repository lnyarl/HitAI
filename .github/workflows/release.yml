name: release

# Publishes installers for macOS (Intel, Apple Silicon) and Windows.
#
# Trigger with a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Or run manually from the Actions tab with a version number.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Create the release first so every platform job uploads into the same one.
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: pick
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Fails the release early if the tag and Cargo version disagree.
      - name: Check version matches the manifest
        run: |
          tag="${{ steps.pick.outputs.version }}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${tag#v}" != "$manifest" ]; then
            echo "Tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      - name: Create or reuse draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pick.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, reusing it."
          else
            gh release create "$tag" \
              --draft \
              --title "HitAI $tag" \
              --generate-notes
          fi

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: cargo test --workspace --exclude hitai-desktop

      # The hook binary ships inside the app as a Tauri sidecar. It must be
      # built for the same target and named with that target triple.
      - name: Build hook sidecar
        shell: bash
        run: |
          cargo build --release -p hitai-hook --target ${{ matrix.target }}
          mkdir -p src-tauri/binaries
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/hitai-hook$ext" \
             "src-tauri/binaries/hitai-hook-${{ matrix.target }}$ext"

      - name: Build CLI
        run: cargo build --release -p hitai-cli --target ${{ matrix.target }}

      # beforeBuildCommand is skipped here: the sidecar is already in place for
      # this exact target, and the default script only builds for the host.
      - name: Package app
        run: npx tauri build --target ${{ matrix.target }} --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect installers and CLI
        shell: bash
        run: |
          mkdir -p out
          bundle="target/${{ matrix.target }}/release/bundle"
          # Installers, if the platform produced any.
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;

          # Standalone CLI, renamed so the three targets do not collide.
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/hitai$ext" \
             "out/hitai-${{ matrix.target }}$ext"

          ls -la out

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ needs.draft.outputs.version }}" out/* --clobber

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.draft.outputs.version }}" --draft=false
