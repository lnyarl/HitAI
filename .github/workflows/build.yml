name: build

# macOS와 Windows 양쪽 산출물을 만든다.
# 이 저장소는 macOS에서 개발되므로 Windows 빌드 검증은 여기서만 이루어진다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Tauri는 리눅스에서만 시스템 의존성이 필요하다. macOS와 Windows는 그대로 빌드된다.
      - name: 테스트
        run: cargo test --workspace --exclude hitai-desktop

      - name: 훅과 CLI 빌드
        run: cargo build --release -p hitai-hook -p hitai-cli

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: hitai-cli-${{ matrix.os }}
          path: |
            target/release/hitai
            target/release/hitai.exe
            target/release/hitai-hook
            target/release/hitai-hook.exe
          if-no-files-found: error

  bundle:
    name: 앱 패키징 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # beforeBuildCommand가 훅을 빌드해 사이드카 자리에 넣는다.
      - name: 패키징
        run: npm run build

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: hitai-app-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
